add_newline = false
format = "$line_break$directory$git_branch$git_status$cmd_duration$status$line_break$character"
palette = "base16"

[character]
error_symbol = "[ >](bold red)"
success_symbol = "[ >](bold green)"

[cmd_duration]
format = "[ took $duration ]($style)"
style = "fg:purple"

[directory]
format = "[ $path ]($style)"
style = "fg:magenta"

[fill]
symbol = " "

[git_branch]
format = "[ $branch ]($style)"
style = "fg:cyan"

[git_status]
format = "[($all_status$ahead_behind )]($style)"
style = "fg:cyan"
conflicted = "‼"
ahead = ""
behind = ""
diverged = ""
renamed = ""
deleted = "-"

[status]
disabled = false
format = "[ $status ($common_meaning$signal_name) ]($style)"
style = "fg:red"

[time]
disabled = false
format = "[ $time ]($style)"
style = "fg:orange"

